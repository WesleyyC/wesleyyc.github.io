<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">

    {% assign meta_title = page.title | default: site.title %}
    {% assign meta_description = page.description | default: site.description %}
    <title>{% if page.title %}{{ meta_title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ meta_description }}">
    <meta name="author" content="{{ site.author }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">

    <meta property="og:title" content="{{ meta_title }}">
    <meta property="og:description" content="{{ meta_description }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:image" content="{{ '/img/profile/wesley-home.jpg' | absolute_url }}">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ meta_title }}">
    <meta name="twitter:description" content="{{ meta_description }}">
    <meta name="twitter:image" content="{{ '/img/profile/wesley-home.jpg' | absolute_url }}">

    <link href="{{ '/css/site.css' | relative_url }}" rel="stylesheet">
    <link rel="shortcut icon" href="/img/logo/logo.ico">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y2HPVMHTRR"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-Y2HPVMHTRR');
    </script>
</head>
